[tool.poetry]
name = "primegraph-core"
license = "MIT"
version = "1.2.0"
description = "Shared cross-package vocabulary for PrimeGraph generated Python packages"
authors = ["PrimeGraph Generator <generator@primegraph.ai>"]
readme = "README.md"

# The importable module is primegraph_core, never `runtime`. A generic
# top-level name collides the moment two distributions are installed into one
# environment, and every generated package shares that environment.
packages = [{ include = "primegraph_core", from = "src" }]

# PEP 561: poetry ships only *.py unless the marker is listed here, and without
# it consumers see the package as untyped.
include = [{ path = "src/primegraph_core/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
# Lower bounds only — never cap the interpreter or a dependency from above.
# The bounds are the ones every generated Python bundle already declares, so a
# consumer installing this distribution next to one of them never resolves two
# pydantic majors.
python = ">=3.11"
pydantic = ">=2"
typing-extensions = ">=4.7"

[tool.poetry.group.dev.dependencies]
mypy = ">=1.11"
pytest = ">=8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
