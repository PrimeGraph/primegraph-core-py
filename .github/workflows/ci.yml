name: CI

# Every generated Python package depends on this distribution, so a regression
# here breaks generated output everywhere. This workflow guards main and
# everything proposed for it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only on purpose. A release bumps the version and pushes a tag, and it is
# run deliberately from a developer machine by scripts/release.sh; CI must
# never tag or publish.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-messages:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          # The hook is run over every commit the change adds, so the whole
          # history has to be present to name the range.
          fetch-depth: 0

      # The rules are not restated here: this runs .githooks/commit-msg, the
      # same script a developer's clone runs, so a message CI accepts is
      # exactly a message the local hook would have accepted.
      - name: Run the repository's commit-msg hook over the new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          EMPTY=0000000000000000000000000000000000000000
          LIST=$(mktemp)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git rev-list --no-merges "$BASE_SHA".."$HEAD_SHA" > "$LIST"
          elif [ "$PUSH_BEFORE" != "$EMPTY" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            git rev-list --no-merges "$PUSH_BEFORE".."$PUSH_AFTER" > "$LIST"
          else
            git rev-list --no-merges -1 "$PUSH_AFTER" > "$LIST"
          fi
          [ -s "$LIST" ] || echo "no new commits to check"
          MSG=$(mktemp)
          STATUS=0
          while read -r SHA; do
            git log -1 --format=%B "$SHA" > "$MSG"
            if sh .githooks/commit-msg "$MSG"; then
              echo "ok  $(git log -1 --format='%h %s' "$SHA")"
            else
              STATUS=1
            fi
          done < "$LIST"
          exit $STATUS

  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.1.0

      - uses: actions/setup-python@v6.3.0
        with:
          # pyproject declares python >=3.11, so 3.11 is the floor the
          # distribution promises to work on and the one worth testing.
          python-version: '3.11'
          # No dependency cache: poetry.lock is gitignored on purpose — this is
          # a library, so it resolves its lower bounds fresh — and the lock file
          # is the only thing setup-python's poetry cache can key on.

      # The poetry version is pinned so a release of the tool cannot change
      # what this check means from one day to the next.
      - name: Install Poetry
        run: pipx install poetry==1.8.5

      # pipx installs poetry against its own interpreter, and poetry would then
      # build the project environment with that one — the pinned version above
      # would never be exercised. This points it at the interpreter setup-python
      # put on PATH.
      - name: Point Poetry at the pinned interpreter
        run: poetry env use "$(command -v python)"

      # The commands the README documents. `poetry build` is deliberately left
      # out: producing a distributable artifact belongs to the release, not to
      # a check of a proposed change.
      - run: poetry check
      - run: poetry install
      - run: poetry run pytest
      # --strict over src and tests; the settings live in pyproject.toml.
      - run: poetry run mypy
